---
# Claim check: Vale lints the organisation profile for absolute claims and
# proves its rule against the planted fixtures in tests/claims/
# (docs/adr/0001-absolute-claim-check.md). The job is no required check; it
# runs on a pull request or master push that changes the profile, the style,
# the fixtures, the script or this workflow, and by hand.
name: Claim check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "profile/**"
      - ".vale.ini"
      - ".vale/**"
      - "tests/claims/**"
      - "scripts/check-claims.sh"
      - ".github/workflows/claims.yml"
  push:
    branches:
      - master
    paths:
      - "profile/**"
      - ".vale.ini"
      - ".vale/**"
      - "tests/claims/**"
      - "scripts/check-claims.sh"
      - ".github/workflows/claims.yml"
  workflow_dispatch:

permissions: {}

# A newer push to a pull request supersedes the older run; master runs stay
# apart per commit.
concurrency:
  group: claims-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  claims:
    name: Claim check
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the profile and prove the rule
        uses: docker://jdkato/vale:v3.26.0@sha256:d4ebc402b255dacc759c468ed8c91bd5be82918bbb59583558539f3be80f1f01
        with:
          entrypoint: /bin/sh
          args: scripts/check-claims.sh
